error.media.access.window.denied=Este recurso no se puede descargar ahora mismo

# Licencia de edicion
error.license.expired=La licencia ha caducado y su periodo de gracia ha terminado. El plano de administracion es de solo lectura; la navegacion, busqueda, exportacion y los sitios publicados siguen disponibles.
error.license.read.only=La licencia esta en solo lectura: crear, publicar e importar estan deshabilitados; navegar, buscar y exportar siguen disponibles.
error.license.revoked=La licencia ha sido revocada. El plano de administracion es de solo lectura. Contacte con el proveedor.
error.license.capability.disabled=La capacidad {1} no esta licenciada para la edicion {0}. Actualice la edicion o ajuste la licencia.
error.license.quota.exceeded=La cuota {0} ha alcanzado su limite autorizado: {1} (actual {2}, agregando {3} {4}). Amplie la cuota o actualice la edicion; lectura, busqueda y exportacion siguen disponibles.
error.license.invalid=La validacion del archivo de licencia ha fallado. Compruebe que este completo y emitido por el proveedor.
error.license.fingerprint.mismatch=La licencia esta vinculada a otra huella de hardware. Suba una licencia coincidente o realice una revinculacion.
error.license.node.limit.exceeded=Se ha alcanzado el limite de nodos en linea. Los nuevos nodos se rechazan; los nodos en ejecucion no se ven afectados.
error.license.clock.regression=Se detecto un retroceso del reloj del servidor. El plano de administracion es de solo lectura; corrija la hora y contacte con soporte.
error.license.seq.regressed=El numero de secuencia de la licencia retrocedio y el archivo fue rechazado. Utilice una licencia mas reciente emitida por el proveedor.
error.license.short.code.invalid=Se rechazo el codigo de activacion corto. Verifique los caracteres, que pertenezca a la secuencia de licencia actual y que la fecha objetivo no supere el maximo autorizado.
error.license.missing=No hay un archivo de licencia instalado. Importe un archivo de licencia emitido por el proveedor.
error.license.capability.unknown=Capacidad desconocida: {0}. Compruebe el nombre de la capacidad o contacte con un administrador.
error.license.batch.size.exceeded=El lote supera el limite de {0} elementos por solicitud para esta edicion ({1} elementos). Divida el trabajo o actualice la edicion.
error.license.public.key.missing=No se encontro la clave publica de verificacion de licencia. Configure powercms.license.public-keys o instale la clave incluida.
error.license.unsupported.algorithm=Algoritmo de firma no admitido o falta el proveedor criptografico nacional. Utilice una licencia firmada con Ed25519.
error.license.public.key.mismatch=La clave publica incluida no coincide con el SHA-256 fijado en la version (o no esta registrada), por lo que se rechazo la carga.
