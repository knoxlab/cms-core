error.site.delete.blocked=El sitio sigue siendo referenciado externamente y no se puede eliminar; consulte la vista previa de eliminación
# Fallo de inicio de sesión (FR-IAM-002): intentos restantes y motivo del estado de la cuenta
error.auth.login.remaining=Nombre de usuario o contraseña incorrectos, quedan {0} intentos
error.auth.login.locked=Cuenta bloqueada. Contacte con un administrador para desbloquearla.
error.auth.login.disabled=Cuenta deshabilitada. Contacte con un administrador.
error.auth.login.pending=Cuenta pendiente de aprobación. Podrá iniciar sesión cuando sea aprobada.
error.auth.login.expired=Contraseña caducada. Cambie su contraseña primero.
