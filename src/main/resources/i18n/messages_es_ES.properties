error.permission.denied=Permiso denegado
error.not.found=Recurso no encontrado
error.method.not.allowed=El método HTTP no está permitido en este endpoint
error.media.type.unsupported=Tipo de contenido de la solicitud no admitido
error.not.acceptable=No se puede generar una respuesta que cumpla el encabezado Accept
