# 안정된 프레임워크 키(FR-I18N-002). 플레이스홀더는 {0}(MessageFormat) 형식.
error.validation.failed=요청 파라미터 검증에 실패했습니다
error.bad.request=요청 파라미터가 잘못되었습니다
error.permission.denied=권한이 없습니다
error.not.found=리소스를 찾을 수 없습니다
error.method.not.allowed=이 엔드포인트는 현재 HTTP 메서드를 지원하지 않습니다
error.media.type.unsupported=지원되지 않는 요청 Content-Type 입니다
error.not.acceptable=Accept 헤더에 맞는 응답을 생성할 수 없습니다
error.site.missing.reselect=사이트를 찾을 수 없습니다. 사이트를 다시 선택하거나 생성해 주세요
error.data.conflict=데이터 제약 조건 충돌이 발생했습니다
error.media.file.too.large=파일이 업로드 크기 제한을 초과했습니다. 압축 후 다시 시도하거나 관리자에게 spring.servlet.multipart 설정 조정을 요청하세요
error.internal=서버 오류가 발생했습니다
error.auth.unauthenticated=먼저 로그인해 주세요
error.auth.token.expired=액세스 토큰이 만료되었습니다 (expired), 새로 발급하세요
error.rate.limited=요청이 너무 많습니다. 잠시 후 다시 시도해 주세요
error.language.unsupported=지원되지 않는 언어입니다: {0}. 선택 가능: {1}
error.user.not.found=사용자를 찾을 수 없습니다
error.media.env.not.configured=사이트에 {0} 환경의 Knox 엔드포인트가 구성되어 있지 않습니다
i18n.language.updated=언어 설정이 저장되었습니다: {0}
error.site.delete.not.archived=사이트가 보관되지 않았습니다. 보관된 사이트만 삭제할 수 있습니다
error.site.delete.blocked=사이트가 외부에서 참조되어 삭제할 수 없습니다. 삭제 미리보기에서 차단 세부 정보를 확인하세요
# 로그인 실패 문구(FR-IAM-002): 남은 시도 횟수와 계정 상태 사유
error.auth.login.remaining=사용자 이름 또는 비밀번호가 올바르지 않습니다. 남은 시도 횟수: {0}회
error.auth.login.locked=계정이 잠겼습니다. 관리자에게 잠금 해제를 요청하세요.
error.auth.login.disabled=계정이 비활성화되었습니다. 관리자에게 문의하세요.
error.auth.login.pending=계정 승인 대기 중입니다. 승인 후 로그인할 수 있습니다.
error.auth.login.expired=비밀번호가 만료되었습니다. 먼저 비밀번호를 변경하세요.
# 전각 문장부호 매핑(Messages.byText 세그먼트 재조립용)
punct.comma=,
punct.period=.
punct.colon=:
punct.semicolon=;
punct.exclamation=!
punct.question=?
punct.enumeration-comma=,
punct.paren-open=(
punct.paren-close=)
punct.bracket-open=「
punct.bracket-close=」
punct.inner-bracket-open=『
punct.inner-bracket-close=』
punct.lenticular-open=[
punct.lenticular-close=]

error.media.download.disabled=이 사이트에서는 다운로드가 비활성화되어 있습니다
error.media.download.denied=이 리소스를 다운로드할 권한이 없습니다
error.media.access.ip.denied=현재 네트워크에서는 이 리소스를 다운로드할 수 없습니다
error.media.access.window.denied=현재 이 리소스의 다운로드 가능 시간대가 아닙니다

# 에디션 라이선스
error.license.expired=라이선스가 만료되었고 유예 기간도 종료되었습니다. 관리 화면은 읽기 전용이지만 조회, 검색, 내보내기, 게시된 사이트는 계속 사용할 수 있습니다.
error.license.read.only=라이선스가 읽기 전용 상태입니다. 생성, 게시, 가져오기는 비활성화되지만 조회, 검색, 내보내기는 사용할 수 있습니다.
error.license.revoked=라이선스가 취소되었습니다. 관리 화면은 읽기 전용입니다. 공급업체에 문의하세요.
error.license.capability.disabled=이 기능({1})은 현재 에디션 {0}에서 라이선스되지 않았습니다. 에디션을 업그레이드하거나 라이선스를 조정하세요.
error.license.quota.exceeded={0} 쿼터가 라이선스 규모 한도 {1}에 도달했습니다(현재 {2}, 추가 {3} {4}). 용량을 늘리거나 에디션을 업그레이드하세요. 조회, 검색, 내보내기는 사용할 수 있습니다.
error.license.invalid=라이선스 파일 검증에 실패했습니다. 파일이 완전하고 공급업체가 발급했는지 확인하세요.
error.license.fingerprint.mismatch=라이선스의 하드웨어 지문이 현재 서버와 일치하지 않습니다. 일치하는 라이선스를 업로드하거나 다시 바인딩하세요.
error.license.node.limit.exceeded=온라인 노드 수가 한도에 도달했습니다. 새 노드는 거부되지만 실행 중인 노드는 영향을 받지 않습니다.
error.license.clock.regression=서버 시계 롤백이 감지되었습니다. 관리 화면은 읽기 전용입니다. 시간을 수정하고 지원팀에 문의하세요.
error.license.seq.regressed=라이선스 시퀀스 번호가 되돌아가 파일이 거부되었습니다. 공급업체가 발급한 최신 라이선스를 사용하세요.
error.license.short.code.invalid=단축 활성화 코드가 거부되었습니다. 문자 오타, 현재 라이선스 시퀀스 일치 여부, 대상 만료일이 상한을 넘지 않는지 확인하세요.
error.license.missing=라이선스 파일이 설치되어 있지 않습니다. 공급업체가 발급한 라이선스 파일을 가져오세요.
error.license.capability.unknown=알 수 없는 기능 플래그 {0}입니다. 기능 플래그 이름을 확인하거나 관리자에게 문의하세요.
error.license.batch.size.exceeded=이 에디션의 요청당 배치 상한은 {0}건입니다(이번 요청 {1}건). 작업을 나누거나 에디션을 업그레이드하세요.
error.license.public.key.missing=라이선스 검증용 공개 키를 찾을 수 없습니다. powercms.license.public-keys를 설정하거나 기본 제공 키를 설치하세요.
error.license.unsupported.algorithm=지원하지 않는 서명 알고리즘 또는 필요한 암호 프로바이더가 없습니다. Ed25519로 서명된 라이선스를 사용하세요.
error.license.public.key.mismatch=내장된 라이선스 공개 키의 SHA-256이 릴리스에 고정된 값과 일치하지 않거나 등록되지 않아 로드를 거부했습니다.
