legacy.\u7ec4\u4ef6\u6570\u636e\u5e8f\u5217\u5316\u5931\u8d25=\ucef4\ud3ec\ub10c\ud2b8 \ub370\uc774\ud130 \uc9c1\ub82c\ud654\uc5d0 \uc2e4\ud328\ud588\uc2b5\ub2c8\ub2e4
