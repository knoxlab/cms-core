legacy.\u53ea\u80fd\u4e3a\u6709\u7ba1\u7406\u6743\u9650\u7684\u7ad9\u70b9\u7b7e\u53d1\ =\uad00\ub9ac \uad8c\ud55c\uc774 \uc788\ub294 \uc0ac\uc774\ud2b8\uc5d0 \ub300\ud574\uc11c\ub9cc \ubc1c\uae09\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4\: 
