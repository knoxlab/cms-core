# エディションライセンス
error.license.expired=ライセンスの有効期限と猶予期間が終了しました。管理画面は読み取り専用ですが、閲覧・検索・エクスポート・公開済みサイトは利用できます。
error.license.read.only=ライセンスは読み取り専用です。新規作成・公開・インポートはできませんが、閲覧・検索・エクスポートは利用できます。
error.license.revoked=ライセンスは取り消されました。管理画面は読み取り専用です。ベンダーにご連絡ください。
error.license.capability.disabled=機能 {1} はエディション {0} ではライセンスされていません。エディションのアップグレードまたはライセンスの調整を行ってください。
error.license.quota.exceeded=クォータ {0} がライセンスの規模上限 {1} に達しました（現在 {2}、追加 {3} {4}）。容量を拡張するかエディションをアップグレードしてください。読み取り・検索・エクスポートは利用できます。
error.license.invalid=ライセンスファイルの検証に失敗しました。ファイルが完全でベンダー発行であることを確認してください。
error.license.fingerprint.mismatch=ライセンスのハードウェアフィンガープリントが現在のサーバーと一致しません。一致するライセンスをアップロードするか再バインドしてください。
error.license.node.limit.exceeded=オンラインノード数が上限に達しました。新規ノードは拒否されますが、稼働中のノードには影響しません。
error.license.clock.regression=サーバー時計の巻き戻しを検出しました。管理画面は読み取り専用です。時刻を修正してサポートにご連絡ください。
error.license.seq.regressed=ライセンスのシーケンス番号が後退したため拒否しました。ベンダー発行の新しいライセンスを使用してください。
error.license.short.code.invalid=短縮アクティベーションコードを拒否しました。文字の読み間違い、現在のライセンスシーケンスとの一致、対象日が上限を超えていないか確認してください。
error.license.missing=ライセンスファイルがインストールされていません。ベンダー発行のライセンスファイルをインポートしてください。
error.license.capability.unknown=不明な機能フラグ {0} です。機能フラグ名を確認するか、管理者に問い合わせてください。
error.license.batch.size.exceeded=このエディションの1リクエストあたりのバッチ上限は {0} 件です（今回 {1} 件）。分割実行するか、エディションをアップグレードしてください。
error.license.public.key.missing=ライセンス検証用の公開鍵が見つかりません。powercms.license.public-keys を設定するか、同梱の鍵をインストールしてください。
error.license.unsupported.algorithm=未対応の署名アルゴリズム、または国密プロバイダがありません。Ed25519 で署名されたライセンスを使用してください。
error.license.public.key.mismatch=同梱のライセンス公開鍵の SHA-256 がリリースに固定された値と一致しない（または未登録）ため、読み込みを拒否しました。
