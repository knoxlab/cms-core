# Edition license (docs/license-and-offline-subscription-design.md §7)
error.license.expired=The license has expired and its grace period has ended. The management plane is read-only; browsing, search, export and published sites remain available.
error.license.read.only=The license is read-only: create/publish/import are disabled, while browsing, search and export remain available.
error.license.revoked=The license has been revoked and the management plane is read-only. Please contact the vendor.
error.license.capability.disabled=Capability {1} is not licensed for edition {0}. Upgrade the edition or adjust the license.
error.license.quota.exceeded=Quota {0} has reached its licensed limit of {1} (current {2}, adding {3} {4}). Expand the quota or upgrade the edition; read, search and export remain available.
error.license.invalid=The license file failed validation. Ensure it is complete and issued by the vendor.
error.license.fingerprint.mismatch=The license is bound to a different hardware fingerprint. Upload a matching license or perform a self-rebind.
error.license.node.limit.exceeded=The online node limit has been reached. New nodes are rejected; running nodes are unaffected.
error.license.clock.regression=A server clock rollback was detected. The management plane is read-only; correct the clock and contact support.
error.license.seq.regressed=The license sequence number regressed and the file was rejected. Use a newer license issued by the vendor.
error.license.short.code.invalid=The short activation code was rejected. Check for misread characters, confirm it belongs to the current license sequence, and ensure the target date does not exceed the licensed maximum.
error.license.missing=No license file is installed. Import a license file issued by the vendor.
error.license.capability.unknown=Unknown capability {0}. Check the capability name or contact an administrator to confirm the edition license.
error.license.batch.size.exceeded=The per-request batch limit for this edition is {0} items ({1} in this request). Split the job into batches or upgrade the edition.
error.license.public.key.missing=The license verification public key was not found. Configure powercms.license.public-keys or install the bundled key.
error.license.unsupported.algorithm=Unsupported signature algorithm or the required national crypto provider is missing. Use a license signed with Ed25519.
error.license.public.key.mismatch=The bundled license public key does not match the SHA-256 pinned in the release (or is not registered), so it was rejected. Use the official release or contact the vendor.
