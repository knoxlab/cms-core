error.site.delete.blocked=站点仍被外部引用，无法删除；请查看删除预览中的阻断明细
# 登录失败文案（FR-IAM-002）：剩余尝试次数与账号状态原因（AuthController / IdentityService）
error.auth.login.remaining=用户名或密码错误，还可尝试 {0} 次
error.auth.login.locked=账号已被锁定，请联系管理员解锁
error.auth.login.disabled=账号已被停用，请联系管理员
error.auth.login.pending=账号正在审核，通过后即可登录
error.auth.login.expired=密码已过期，请先修改密码
