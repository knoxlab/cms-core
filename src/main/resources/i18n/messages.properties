# 版本授权（docs/license-and-offline-subscription-design.md §7）
error.license.expired=授权已到期且宽限期结束，管理面已降级为只读；浏览、检索、导出与已发布站点仍可用
error.license.read.only=授权处于只读状态，禁止新建/发布/导入；浏览、检索与导出不受影响
error.license.revoked=授权已被吊销，管理面为只读；请联系厂商恢复
error.license.capability.disabled=当前版本 {0} 未授权能力 {1}，请升级版本或调整授权
error.license.quota.exceeded={0} 配额已达上限 {1}（当前 {2}，本次追加 {3} {4}），请扩容或升级版本；读取、检索与导出不受影响
error.license.invalid=授权文件校验失败，请确认文件完整且由官方签发
error.license.fingerprint.mismatch=授权绑定的硬件指纹与当前服务器不匹配，请上传匹配的授权或执行自助重绑
error.license.node.limit.exceeded=在线节点数已达授权上限，新节点拒绝接入；已运行节点不受影响
error.license.clock.regression=检测到服务器时钟回拨，管理面已降级为只读；请校正时间后联系支持
error.license.seq.regressed=授权序列号回退，已拒绝导入；请使用厂商签发的更新授权文件
error.license.short.code.invalid=短激活码校验失败或不可用：请核对字符是否抄错、是否属于当前授权序列，且目标有效期不得超过授权上限
error.license.missing=尚未安装授权文件，请导入厂商签发的授权文件
error.license.capability.unknown=未知的能力位：{0}，请检查能力位名称或联系管理员确认版本授权
error.license.batch.size.exceeded=单次批量操作上限 {0} 条，本次 {1} 条；请分批执行或升级版本（矩阵 B7）
error.license.public.key.missing=未找到授权验签公钥，请配置 powercms.license.public-keys 或安装内置公钥
error.license.unsupported.algorithm=不支持的签名算法或缺少国密 Provider，请使用 Ed25519 签发的授权
error.license.public.key.mismatch=内置公钥的 SHA-256 与代码钉固值不一致（或未登记），已拒绝加载；请使用官方发行物或联系厂商重新内置公钥
