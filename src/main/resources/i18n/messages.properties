error.media.type.unsupported=不支持的请求体类型
error.not.acceptable=无法按 Accept 头生成响应
error.site.missing.reselect=站点不存在，请重新选择或创建站点
error.data.conflict=数据约束冲突
error.media.file.too.large=文件超过上传大小限制，请压缩后重试或联系管理员调整 spring.servlet.multipart 配置
error.internal=服务端错误
error.auth.unauthenticated=请先登录
error.auth.token.expired=访问令牌已过期，请重新签发（expired）
error.rate.limited=请求过于频繁，请稍后重试
