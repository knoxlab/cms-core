# Licence d'edition
error.license.expired=La licence a expire et sa periode de grace est terminee. Le plan d'administration est en lecture seule ; la navigation, la recherche, l'export et les sites publies restent disponibles.
error.license.read.only=La licence est en lecture seule : creation, publication et import sont desactives ; navigation, recherche et export restent disponibles.
error.license.revoked=La licence a ete revoquee. Le plan d'administration est en lecture seule. Contactez le fournisseur.
error.license.capability.disabled=La capacite {1} n''est pas licenciee pour l''edition {0}. Mettez a niveau l''edition ou ajustez la licence.
error.license.quota.exceeded=Le quota {0} a atteint sa limite autorisee : {1} (actuel {2}, ajout de {3} {4}). Augmentez le quota ou changez d''edition ; lecture, recherche et export restent disponibles.
error.license.invalid=La validation du fichier de licence a echoue. Verifiez qu'il est complet et emis par le fournisseur.
error.license.fingerprint.mismatch=La licence est liee a une autre empreinte materielle. Importez une licence correspondante ou effectuez un re-liaison.
error.license.node.limit.exceeded=Le nombre de noeuds en ligne a atteint la limite. Les nouveaux noeuds sont refuses ; les noeuds en cours ne sont pas affectes.
error.license.clock.regression=Un recul de l'horloge serveur a ete detecte. Le plan d'administration est en lecture seule ; corrigez l'heure et contactez le support.
error.license.seq.regressed=Le numero de sequence de la licence a regresse ; le fichier est refuse. Utilisez une licence plus recente emise par le fournisseur.
error.license.short.code.invalid=Le code d'activation court a ete refuse. Verifiez les caracteres, l'appartenance a la sequence de licence actuelle et que la date cible ne depasse pas le maximum autorise.
error.license.missing=Aucun fichier de licence n'est installe. Importez un fichier de licence emis par le fournisseur.
error.license.capability.unknown=Capacite inconnue : {0}. Verifiez le nom de la capacite ou contactez un administrateur pour confirmer la licence d''edition.
error.license.batch.size.exceeded=La taille du lot depasse la limite de {0} elements par requete pour cette edition ({1} elements). Decoupez le traitement ou changez d''edition.
error.license.public.key.missing=La cle publique de verification de licence est introuvable. Configurez powercms.license.public-keys ou installez la cle fournie.
error.license.unsupported.algorithm=Algorithme de signature non pris en charge ou fournisseur national manquant. Utilisez une licence signee avec Ed25519.
error.license.public.key.mismatch=La cle publique incluse ne correspond pas au SHA-256 fige dans la version (ou nest pas enregistree) : chargement refuse.
