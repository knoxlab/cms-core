# 由 powercms_tokenize.py 生成、人工补充 idgen（identity 自增列，MySQL 语法位不同）。
# ANSI 组：H2 / PostgreSQL / 金仓 KingbaseES（PG 兼容）共用。
# 迁移脚本中的 «token» 由 spring.flyway.placeholders 注入；经 application.yml 各 profile
# 以 spring.config.import 引入（db-h2 / db-postgres / db-kingbase / 测试配置）。
spring:
  flyway:
    placeholders:
      blob: bytea
      fn_lf: chr(10)
      fn_uuid: gen_random_uuid()
      idgen: generated by default as identity
      idgen_always: generated always as identity
      idx: index if not exists
      ts: timestamp
      tstz: timestamp with time zone
      # MySQL 分数秒列 DEFAULT 须匹配精度（datetime(6) 裸 current_timestamp 报 1067，实测）：
      # ansi/dm 组渲染裸词（与迁移原句语义一致），mysql 组见 mysql 文件
      def_now: default current_timestamp
      txt: text
      uuid: uuid
      # boolean 列与字面量（达梦无 boolean 列类型 → bit/0/1，见 dm 组；ANSI 组渲染回原字面）
      bool: boolean
      lit_t: true
      lit_f: false
      # DM 严格保留字列名（comment 为 DM 保留字，实测裸定义/裸 SELECT 报 Syntax error；
      # ANSI/MySQL 组渲染回裸词，DM 组渲染为小写双引号标识符——列名存小写与 Hibernate 一致）
      col_comment: comment
      # DM 严格保留字（DmProbe27：裸 link 列定义/SELECT 报 Syntax error，同 comment 模式）
      col_link: link
      # DM 严格保留字（V132 access_log.identity 列；同 comment/link 模式，H2/PG/MySQL 实测可作列名）
      col_identity: identity
      # DM 同列组合索引唯一（ix_ai_ask_log_site_created 与 V85 idx_ask_log_site_time 同为
      # (site_id, created_at)，DM 报 such column list already indexed → no-op；PG/H2/MySQL 允许并存）
      idx_v114: CREATE INDEX ix_ai_ask_log_site_created ON ai_ask_log (site_id, created_at);
      # alter 语句方言化（DM 不支持 alter column drop not null / set data type → modify；
      # ansi 值逐字等于原句，mysql 用 modify+完整类型；分号在脚本侧 token 外）
      alt_dropnn_v10: ALTER TABLE content_item ALTER COLUMN category_id DROP NOT NULL
      alt_dropnn_v112: ALTER TABLE kg_node ALTER COLUMN content_type_id DROP NOT NULL
      alt_dropnn_v32: alter table workflow_transition alter column allowed_role_id drop not null
      alt_settype_v55: alter table organization_settings alter column branding set data type varchar(2000)
      # V10 页面路由唯一索引：PG 系/H2/MySQL 唯一索引对 NULL 互不冲突（NULL-distinct），
      # 原句即正确；达梦组见 dm 文件（NULL 不可区分 → nvl(id) 兜底函数索引）
      uq_route_v10: CREATE UNIQUE INDEX uq_content_page_route ON content_item (site_id, route_path)
      cm_V90: |-
        COMMENT ON COLUMN ai_site_policy.citation_min_trust IS
            'FR-AI-SRC-004 AI 引用最低可信等级（0..3）；低于该等级的条目不进入 AI 引用';
      cm_V92: |-
        COMMENT ON COLUMN ai_site_policy.ask_routing_enabled IS
            'FR-AI-RAG-011 站内问答多源检索路由开关；关闭后一律走全源混合检索';
      cm_V93: |-
        COMMENT ON COLUMN ai_ask_log.cited_content_ids IS
            'FR-AI-GEO-004 被引用内容条目 ID（JSON 数组；与统计模块引用埋点口径一致）';
      cm_V94: |-
        COMMENT ON COLUMN media_asset.transcript IS
            'FR-AI-MEDIA-001 转写稿全文（Knox 字幕 cues 拼接；AI 产物，GOV-007 标识见 transcript_model）';
        COMMENT ON COLUMN media_asset.transcript_lang IS
            'FR-AI-MEDIA-001 转写语种（BCP-47 主子标签）';
        COMMENT ON COLUMN media_asset.transcript_model IS
            'FR-AI-MEDIA-001 转写模型标识（GOV-007 AI 产物标识，回写 MEDIA 内容项 ai_model）';
        COMMENT ON COLUMN media_asset.transcript_synced_at IS
            'FR-AI-MEDIA-001 转写同步游标（null = 从未同步；checked 无轨道也会推进避免空转）';
      cm_V95: |-
        COMMENT ON COLUMN knox_media_ref.transcript_synced_at IS
            'FR-AI-MEDIA-001 上次同步 Knox 转写稿（字幕 cues）的时间（null = 从未同步）';
      cm_V97: |-
        COMMENT ON COLUMN media_asset.summary IS
            'FR-AI-MEDIA-002 媒体内容摘要（基于转写稿 LLM 生成；人工修订后仍保留，AI 标识见 summary_model）';
        COMMENT ON COLUMN media_asset.summary_model IS
            'FR-AI-MEDIA-002 摘要生成模型标识（GOV-007 AI 产物标识）';
        COMMENT ON COLUMN media_asset.summary_synced_at IS
            'FR-AI-MEDIA-002 摘要生成时间';
      cm_V98: |-
        COMMENT ON COLUMN media_asset.chapters IS
            'FR-AI-MEDIA-002 智能章节时间戳（JSON 数组，格式 [{"time":0,"title":"Introduction"}, ...]）';
        COMMENT ON COLUMN media_asset.chapters_model IS
            'FR-AI-MEDIA-002 章节生成模型标识（GOV-007 AI 产物标识）';
        COMMENT ON COLUMN media_asset.chapters_synced_at IS
            'FR-AI-MEDIA-002 章节同步时间';
      cm_V110: |-
        COMMENT ON COLUMN ai_site_policy.citation_gate_mode IS
            'FR-AI-SRC-004 引用闸门故障策略：FAIL_CLOSED（默认，异常即排除）/ DEGRADED（异常降级放行）';
      cm_V111: |-
        COMMENT ON TABLE content_source_fact IS
            'FR-AI-SRC-004 统一来源事实元数据（来源系统/对象 ID/版本/审批状态/有效期/可信等级/版权/同步游标）';
        COMMENT ON COLUMN content_source_fact.approval_status IS
            '来源侧审批状态：APPROVED / PENDING / REJECTED；PENDING/REJECTED 不进入 AI 引用';
        COMMENT ON COLUMN content_source_fact.valid_until IS
            '来源事实有效期上限（null=不限）；过期内容不进入 AI 引用（与 SRC-002 同口径）';
      cm_V112: |-
        COMMENT ON COLUMN kg_node.node_origin IS
            'FR-AI-SRC-005 节点来源：CONTENT（content_item 投影）/ NATIVE（DAM/PIM 外部对象直接建模）';
        COMMENT ON COLUMN kg_node.approval_status IS
            '来源侧审批状态：APPROVED / PENDING / REJECTED；PENDING/REJECTED 不进入 AI 引用';
        COMMENT ON COLUMN kg_node.valid_until IS
            '来源事实有效期上限（null=不限）；过期节点不进入 AI 引用（与 SRC-002/004 同口径）';
      cm_V113: |-
        COMMENT ON TABLE ai_source_route_rule IS
            'FR-AI-RAG-011 多源检索路由策略：站点级问题类型（PIM/DAM/CMS）→ 分类关键词 + 来源域优先级（逗号分隔；* = 全源兜底）';
        COMMENT ON COLUMN ai_source_route_rule.keywords IS
            '分类关键词，逗号分隔，大小写不敏感；首条命中即归入该 question_kind';
        COMMENT ON COLUMN ai_source_route_rule.source_priority IS
            '来源域优先级，逗号分隔，按序尝试：PIM: / DAM: / CMS: / *（全源兜底）；首选无命中自动回退次选';
      cm_V114: |-
        COMMENT ON COLUMN ai_ask_log.route_source_filter IS
            'FR-AI-RAG-011/012 本次问答实际生效的来源域过滤（NULL=全源；_prefix:PIM: 等前缀语义）';
        COMMENT ON COLUMN ai_ask_log.cited_source_domains IS
            'FR-AI-RAG-012 本次答案引用的来源域（去重保序，逗号分隔；取自检索命中字段，非模型输出）';
        COMMENT ON COLUMN ai_ask_log.citation_source_consistent IS
            'FR-AI-RAG-012 引用来源域与实际检索路径是否一致（false=检出并剔除不一致引用）';
        COMMENT ON COLUMN ai_ask_log.citation_source_mismatches IS
            'FR-AI-RAG-012 本次被剔除的来源域不一致引用条数';
      cm_V120: |-
        COMMENT ON COLUMN content_version.title IS
            'FR-CV-VER-001/003：该版本条目级标题快照（早期行按内容当前标题回填）';
        COMMENT ON COLUMN content_version.route_path IS
            'FR-CV-VER-001/003：该版本页面路径快照（仅 PAGE 型，早期行按内容当前路径回填）';
        COMMENT ON COLUMN content_version.template_path IS
            'FR-CV-VER-001/003：该版本页面模板快照（仅 PAGE 型，早期行按内容当前模板回填）';
      cm_V121: |-
        COMMENT ON COLUMN content_version.reverted_from IS
            'OBS-11-10：本版本由「恢复到 v{n}」产生时的来源版本号 n；NULL 表示非恢复产生的版本';
      cm_V122: |-
        COMMENT ON COLUMN content_version.published IS
            'DEF-11-02：TRUE 表示本版本由「发布」动作生成（版本历史中的发布节点），普通保存/AI 采纳/恢复为 FALSE';
      cm_V123: |-
        COMMENT ON COLUMN search_index_mapping_state.target IS
            'ADMIN=管理索引 / PUBLIC=访客索引；两索引的字段集合不同（adminIndex vs publicIndex），须分别比对';
        COMMENT ON COLUMN search_index_mapping_state.applied_fingerprint IS
            '最近一次成功全量重建时生效的 schema 指纹；NULL 表示尚无基线';
        COMMENT ON COLUMN search_index_mapping_state.desired_fingerprint IS
            '最近一次模型发布后按内容模型重算的 schema 指纹；与 applied 不等即需重建';
      cm_V127: |-
        COMMENT ON COLUMN datasource_sync_log.warning_message IS
            'FR-AI-SRC-001 配置级提示（不阻断同步，同步仍可为 SUCCESS/PARTIAL）：NULL=无';
      cm_V128: |-
        COMMENT ON COLUMN datasource_registration.source_category IS
            'FR-AI-SRC-003 来源域类别（DEF-MSRC-06）：PIM/DAM/OTHER，决定同步打标前缀 PIM:/DAM:（OTHER 不加前缀）';

      # ---- MySQL 回归修复组：release 保留字 / TEXT 默认 / 前缀键 / set-not-null / 自增键 ----
      tbl_release: release
      def_arr: default '[]'
      def_obj: default '{}'
      alt_setnn_v25_tr: alter table release_theme_version alter column theme_revision_id set not null
      alt_setnn_v25_rr: alter table release_theme_version alter column reference_role set not null
      alt_setnn_v25_fd: alter table release_theme_version alter column file_digest set not null
      alt_setnn_v102_s: alter table agent_message alter column site_id set not null
      alt_setnn_v102_u: alter table agent_message alter column user_id set not null
      uq_v28: unique(site_id, path)
      uq_v16: unique(theme_id, path)
      uq_v17: unique(theme_revision_id, path)
      pk_v56: primary key (site_id, stat_date, route_path)
      col_log_id: id          bigint generated always as identity
      uq_v22: unique(site_id, path)
      idx_v14: create index idx_release_page_route on release_page(release_id,route_path)

      # ---- MySQL 5.5 回归修复组：utf8mb4 767 字节键前缀 / drop constraint（ansi）----
      uq_sp_name: 'unique (site_id, name)'
      uq_v4_tf_path: 'unique (template_project_id, path)'
      uq_v6_pkg: 'unique (package_id, version)'
      uq_v9_rel: 'unique (site_id, relation_name)'
      uq_ns_name: 'unique(site_id, name)'
      uq_v12_zone: 'unique(template_id, zone_key)'
      uq_v21_path: 'unique(site_id, path)'
      uq_v21_route: 'unique(site_id, route_path, http_method)'
      alt_dropc_v51: 'alter table knox_site_binding drop constraint uq_knox_binding_site'
      pk_v56_src: 'primary key (site_id, stat_date, source_type, detail)'
      pk_v56_custom: 'primary key (site_id, stat_date, event_name, attr_key, attr_value)'
      col_v75_idem: 'idem_key    varchar(300) not null unique'
      uq_v88_site: 'CONSTRAINT uq_datasource_site_name UNIQUE (site_id, name)'
      uq_v88_map: 'CONSTRAINT uq_mapping_ds_ext UNIQUE (datasource_id, external_field)'
      uq_v89_site: 'CONSTRAINT uq_relation_template_site_name UNIQUE (site_id, name)'
      idx_v108: 'create unique index uk_media_folder_site_path on media_folder (site_id, path)'
